version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hersnnet-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - hersnnet-data:/app/data
    networks:
      - hersnnet-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hersnnet-frontend
    restart: unless-stopped
    networks:
      - hersnnet-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hersnnet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hersnnet-net

networks:
  hersnnet-net:
    driver: bridge

volumes:
  hersnnet-data:
